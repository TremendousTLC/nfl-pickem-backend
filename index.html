<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NFL Weekly Matchup 008</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- TOP: LOGO BANNER -->
  <div id="logo-banner"></div>

  <div id="app">

    <!-- LEFT: LEAGUE PANEL -->
    <section id="league-panel">
      <h2>League</h2>

      <div class="league-current-player">
        <label for="player-name">Player / Team Name:</label>
        <input type="text" id="player-name" placeholder="e.g. Terry, Legendary-Fake-Laughers">
        <button id="set-player-btn">Set Player</button>
      </div>

      <div class="league-stats">
        <p><strong>Total Participants:</strong> <span id="total-participants">0</span></p>
        <p><strong>Participants This Week:</strong> <span id="week-participants">0</span></p>
      </div>

      <div class="league-actions">
        <button id="leaderboard-btn">View Leaderboard</button>
        <button id="view-submissions-btn">View Submissions</button>
      </div>

      <div id="leaderboard-panel" class="panel hidden">
        <h3>Season Leaderboard</h3>
        <div id="leaderboard-list"></div>
      </div>

      <div id="player-picks-panel" class="panel hidden">
        <h3>Player Picks</h3>
        <div id="player-picks-content"></div>
      </div>

      <div id="submissions-window" class="panel hidden">
        <h3>Weekly Submissions</h3>
        <div id="submissions-list"></div>
      </div>
    </section>

    <!-- CENTER: WEEKLY PICKS -->
    <section id="picks-panel">
      <h2>Weekly Picks</h2>

      <!-- ⭐ FIXED WEEK NAV (this is the one between the arrows) -->
      <div id="picks-week-nav" class="week-nav">
        <button id="prev-week" onclick="changeWeek(-1)">◀</button>
        <span id="picks-current-week">Week -</span>
        <button id="next-week" onclick="changeWeek(1)">▶</button>
      </div>

      <div id="picks-table"></div>

      <div class="picks-actions">
        <button id="submit-picks-btn">Submit Picks</button>
        <button id="edit-picks-btn">Edit Picks</button>
      </div>

      <div id="picks-notification" class="notification hidden"></div>

      <div id="picks-detail-window">
        <!-- Team / matchup / bye info goes here -->
      </div>
    </section>

    <!-- RIGHT: NFL PANEL -->
    <section id="nfl-panel">
      <h2>NFL Dashboard</h2>

      <!-- ⭐ This stays exactly as-is -->
      <div id="current-week-display">
        <strong>Current NFL Week:</strong> <span id="current-week">-</span>
      </div>

      <div id="nfl-standings">

        <!-- AFC block -->
        <div class="conference-block">
          <div class="conference-left">
            <h3>AFC Standings</h3>
            <div id="afc-standings"></div>
          </div>

          <div class="conference-right">
            <h4>AFC Best Teams</h4>
            <div id="afc-best"></div>
          </div>
        </div>

        <!-- NFC block -->
        <div class="conference-block">
          <div class="conference-left">
            <h3>NFC Standings</h3>
            <div id="nfc-standings"></div>
          </div>

          <div class="conference-right">
            <h4>NFC Best Teams</h4>
            <div id="nfc-best"></div>
          </div>
        </div>

      </div>

      <div class="nfl-buttons">
        <button id="teams-btn">Teams</button>
        <button id="schedule-btn">NFL Schedule</button>
      </div>

      <div id="teams-panel" class="panel hidden">
        <h3>Teams</h3>
        <div id="teams-list"></div>
      </div>

      <div id="team-detail-panel" class="panel hidden">
        <h3>Team Info & Schedule</h3>
        <div id="team-info"></div>
        <div id="team-schedule"></div>
      </div>

      <div id="nfl-schedule-panel" class="panel hidden">
        <h3>NFL Schedule</h3>
        <label for="schedule-week-select">Week:</label>
        <select id="schedule-week-select"></select>
        <div id="nfl-schedule-week"></div>
      </div>

    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
